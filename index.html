<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Global assignment safety shim for sandboxed frame environments
      (function() {
        const patchWritable = (obj, prop) => {
          try {
            // Find where the property descriptor is in the prototype chain
            let current = obj;
            let desc = null;
            while (current) {
              desc = Object.getOwnPropertyDescriptor(current, prop);
              if (desc) break;
              current = Object.getPrototypeOf(current);
            }

            // If we found the descriptor, and it's configurable but lacks a setter, patch it there
            if (desc) {
              if (!desc.set && desc.configurable) {
                let val = current[prop];
                Object.defineProperty(current, prop, {
                  get: () => val,
                  set: (newVal) => { val = newVal; },
                  configurable: true,
                  enumerable: true
                });
                return;
              }
            }

            // Otherwise, get the current value (preserving the native function/class)
            let val = obj[prop];

            // Try defining it on Window.prototype (obj.__proto__) to intercept window.prop assignments
            if (obj.__proto__) {
              try {
                Object.defineProperty(obj.__proto__, prop, {
                  get: () => val,
                  set: (newVal) => { val = newVal; },
                  configurable: true,
                  enumerable: true
                });
                return;
              } catch (e) {
                // Fall through to try defining on the instance
              }
            }

            // Fallback: Try defining the property with a getter/setter directly on the instance
            Object.defineProperty(obj, prop, {
              get: () => val,
              set: (newVal) => { val = newVal; },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            console.warn(`[IICS-Shim] Failed to patch ${prop}`, e);
          }
        };
        patchWritable(window, 'fetch');
        patchWritable(window, 'FormData');
        patchWritable(window, 'Request');
        patchWritable(window, 'Response');
        patchWritable(window, 'Headers');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <title>IICS - Instituto de Investigación Científica Social</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
